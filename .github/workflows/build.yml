name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android @wllama/wllama
      - run: mkdir -p www/esm && cp -r node_modules/@wllama/wllama/esm/* www/esm/
      - run: pip install huggingface_hub
      - run: |
          python -c "from huggingface_hub import hf_hub_download; import shutil; p = hf_hub_download('Qwen/Qwen2.5-0.5B-Instruct-GGUF', 'qwen2.5-0.5b-instruct-q4_k_m.gguf'); shutil.copy(p, 'www/model.gguf')"
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TemanAI-offline-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
